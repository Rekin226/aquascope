name: CAMELS Benchmark

# Nightly smoke test for the benchmark suite.
# Runs AquaScope's own methods against the committed CAMELS
# benchmark data, fully offline (generation-only network scripts are never
# invoked). Produces results.json -- the single source of truth -- plus its
# Markdown/HTML renderings, all uploaded as one artifact. The exit code is
# deliberately smoke-only: the run hard-fails through the Pydantic models if
# any result no longer validates, while the recorded numbers live in the
# artifact for inspection. --strict is asserted here against the committed
# known_misses baseline: known standing misses pass, while any unexpected
# regression or integrity defect fails the nightly.
# Timings are recorded in results.json but never asserted on a shared runner.

on:
  schedule:
    - cron: "0 0 * * *"  # Nightly at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Note when the job started (its health record's duration)
        run: echo "JOB_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install AquaScope (with benchmarks dependencies)
        run: pip install -e ".[benchmarks]"

      - name: Run the CAMELS benchmark
        run: python -m benchmarks.camels_benchmark --output-dir benchmark-output --strict

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: camels-benchmark-report-${{ github.run_id }}
          path: benchmark-output/

      # Job health (#593): health/jobs/camels-benchmark.json and health/jobs/index.json, written only under
      # health/jobs/, and one job-health issue, opened or updated when a scheduled run fails and closed by the next
      # good one. It runs whether the job passed or not, needs only the standard library to record and to file the
      # issue, and never turns the job red itself.
      - name: Job health
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PUBLISH: ${{ secrets.HF_TOKEN != '' && github.event_name == 'schedule' }}
          ISSUE: ${{ github.event_name == 'schedule' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$PUBLISH" = "true" ]; then python3 -m pip install -q "huggingface_hub>=0.20"; fi
          python3 .github/scripts/job_health.py report camels-benchmark --status "${{ job.status }}" \
            --started "$JOB_STARTED" --run-url "$RUN_URL" --publish "$PUBLISH" --issue "$ISSUE"
