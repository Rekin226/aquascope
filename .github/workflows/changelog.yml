name: CHANGELOG Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      # Keep checkout's default ref. On pull_request it is refs/pull/<n>/merge,
      # the PR merged with the current base, so check_changelog.py sees where each
      # added CHANGELOG line lands on main. A branch that waited across a release
      # has its line merged into the released section, which the PR head alone hides.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require CHANGELOG entry on PRs
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: python .github/scripts/check_changelog.py
