name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,all]"
      - run: ruff check aquascope/ tests/
      - name: Type check (informational — does not fail build)
        run: mypy aquascope/ --ignore-missing-imports
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,all]"
      - run: pytest --cov=aquascope --cov-report=term-missing --cov-report=xml
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  contributors-board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the README board lists every commit author
        env:
          PRIVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=$(npx --yes all-contributors-cli check)
          echo "$out"
          # Bot authors (e.g. allcontributors[bot], which authors the board PRs
          # themselves) are never credited on the board, so ignore them.
          missing=$(echo "$out" | sed -n '/Missing contributors/,$p' | tail -n +2 \
            | sed 's/^[[:space:]]*//' | grep -v '\[bot\]$' | grep -v '^$' || true)
          if [ -n "$missing" ]; then
            echo "::error::The contributors board is missing: $missing. Comment '@all-contributors please add @<username> for <contribution>' on their merged PR (needs the all-contributors GitHub App), or run 'npx all-contributors-cli add <username> <contribution>' locally."
            exit 1
          fi
