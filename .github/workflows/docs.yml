name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "aquascope/**"
      - "explorer/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # social plugin uses git history for page timestamps

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps for social-card plugin (libcairo, etc.)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcairo2-dev libfreetype-dev libffi-dev libjpeg-dev libpng-dev libz-dev pkg-config

      - name: Install package + docs extras
        run: pip install -e ".[docs]" build

      - name: Build site
        run: mkdocs build --strict

      # Under /explorer/app/, not /explorer/: mkdocs renders docs/explorer.md to
      # site/explorer/index.html, and copying the app on top of it made that page
      # unreachable, so the nav entry opened the app instead of the documentation.
      - name: Add the Explorer under /explorer/app/ (#189)
        run: python explorer/build.py --out site/explorer/app --no-space-readme

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
