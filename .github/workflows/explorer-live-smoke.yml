name: Explorer live record-to-export

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      repetitions:
        description: "Repetitions per region (5 or more for p50/p75)"
        default: "1"
        type: choice
        options: ["1", "5", "10"]

permissions:
  contents: read
  issues: write

concurrency:
  group: explorer-live-smoke
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Note when the job started (its health record's duration)
        run: echo "JOB_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser check dependencies
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Check US, UK and French records and downloads
        env:
          AQ_REPETITIONS: ${{ inputs.repetitions || '1' }}
        run: node .github/scripts/explorer_smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explorer-live-record-to-export
          path: browser-smoke-output/
          retention-days: 30

      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: "3.12"

      # Job health (#593): health/jobs/explorer-live-smoke.json and health/jobs/index.json, written only under
      # health/jobs/, and one job-health issue, opened or updated when a scheduled run fails and closed by the next
      # good one. It runs whether the job passed or not, needs only the standard library to record and to file the
      # issue, and never turns the job red itself.
      - name: Job health
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PUBLISH: ${{ secrets.HF_TOKEN != '' && github.event_name == 'schedule' }}
          ISSUE: ${{ github.event_name == 'schedule' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$PUBLISH" = "true" ]; then python3 -m pip install -q "huggingface_hub>=0.20"; fi
          python3 .github/scripts/job_health.py report explorer-live-smoke --status "${{ job.status }}" \
            --started "$JOB_STARTED" --run-url "$RUN_URL" --publish "$PUBLISH" --issue "$ISSUE"
