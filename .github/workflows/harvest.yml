name: Harvest station catalogs

# The Archive (#188). Phase 0: every station-capable source is asked for its
# catalog (GeoParquet + GeoJSON + health.json). Phase 1: a budget of stations
# per source gets its daily series harvested into obs/<variable>/<source>/,
# incrementally (the previous obs/ tree is synced first). Phase 2: more
# variables (level, rainfall, groundwater) and one Parquet bundle per variable
# and source. Everything is then published to the public Hugging Face dataset. Per-source failures are
# recorded and shown in the job summary; the run only fails when every
# catalog source failed.

on:
  schedule:
    - cron: "17 3 * * 1"  # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the Hugging Face dataset"
        type: boolean
        default: true
      max_items:
        description: "Cap per source (leave empty for the full catalog)"
        type: string
        default: ""
      obs_budget:
        description: "Stations per source to harvest daily series for (default 150)"
        type: string
        default: ""
      skip_obs:
        description: "Skip the observation harvest (catalog, station catchments and bundles only)"
        type: boolean
        default: false
      health_issues:
        description: "Open / update / close collector-health issues, as the Monday run does"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET: Rekin226/aquascope-gauges
      # Optional: a free USGS API key raises the keyless rate limit of the
      # Water Data API on the national catalog walk (https://api.waterdata.usgs.gov/signup/).
      USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
    steps:
      - name: Note when the job started (its health record's duration)
        run: echo "JOB_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install aquascope with the archive and basins extras
        run: python -m pip install -q ".[archive,basins]"

      - name: Sync the existing observations (incremental runs)
        if: env.HF_TOKEN != ''
        run: python -c "from aquascope.archive.observations import sync_from_hub; sync_from_hub('archive', '$HF_DATASET')"

      - name: Harvest station catalogs
        id: harvest
        run: |
          set +e
          ARGS="--out archive"
          if [ -n "${{ inputs.max_items }}" ]; then ARGS="$ARGS --max-items ${{ inputs.max_items }}"; fi
          aquascope harvest stations $ARGS
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Assign every station to its BasinATLAS sub-basin (basins/station_catchments.parquet)
        # Reads the published lev12.fgb (955 MB) and lev12_attributes.parquet from the Hub, spatially joins the
        # fresh catalog, and writes the table the similar-basins search runs on. Skipped when basins are not
        # published yet; a failure here must not stop the observation harvest.
        continue-on-error: true
        run: |
          python - <<'EOF'
          import os, sys, logging
          logging.basicConfig(level=logging.INFO, format="%(message)s")
          from huggingface_hub import hf_hub_download
          repo = os.environ["HF_DATASET"]
          try:
              fgb = hf_hub_download(repo, "basins/lev12.fgb", repo_type="dataset")
              attrs = hf_hub_download(repo, "basins/lev12_attributes.parquet", repo_type="dataset")
          except Exception as exc:
              print(f"basins not published yet, skipping ({exc})"); sys.exit(0)
          from aquascope.archive.similar import assign_station_catchments
          from aquascope.archive.catalog import load_stations
          catalog = load_stations(path="archive/stations.parquet")
          table = assign_station_catchments(catalog, fgb, attrs, "archive/basins/station_catchments.parquet")
          print(f"{len(table):,} of {len(catalog):,} stations assigned")
          EOF

      # Poland IMGW's daily archive is ~870 zips (~180 MB), one request each; finished hydrological years never
      # change. Keeping them between runs turns a 15-minute download into a restore. The key changes every
      # run so the newest copy is saved; restore-keys picks up the last one.
      - name: Restore the IMGW archive zips
        if: ${{ !inputs.skip_obs }}
        uses: actions/cache@v4
        with:
          path: data/cache/poland_imgw
          key: imgw-archive-${{ github.run_id }}
          restore-keys: imgw-archive-

      # The observation harvest is allowed to stop early (#449). The Archive fills up over weeks, so a partial
      # harvest is the normal case: each source has its own deadline inside the step's budget, the step may time
      # out, and either way the steps after it (bundles, signatures, publish) still run on what was mirrored.
      # A step timeout that used to skip them threw two hours of harvesting away on 2026-09-21.
      - name: Harvest daily observations with isolated source deadlines
        id: obs
        if: ${{ !inputs.skip_obs }}
        timeout-minutes: 180
        continue-on-error: true
        env:
          OBS_BUDGET: ${{ inputs.obs_budget || '150' }}
        run: python -m aquascope.archive.refresh --out archive --budget "$OBS_BUDGET" --scheduled-budgets

      - name: Roll the per-station files into Parquet bundles (one per variable and source)
        id: bundles
        run: aquascope harvest bundles --out archive

      - name: Per-station flow signatures (signatures.parquet, the Explorer's map filter)
        # The stations step already built it from last week's files; this refresh adds what obs just mirrored.
        continue-on-error: true
        run: aquascope harvest signatures --out archive

      - name: Donor signatures and leave-one-out skill (basins/station_signatures.parquet, regionalization_skill.json)
        # Flow signatures of every gauged station with 10+ years of archived discharge and a catchment row, then
        # every donor predicted from the others (even stride sample) so the regionalisation reports its own skill.
        # Skipped quietly when the catchment table is not on the Hub yet or the discharge bundles are empty.
        continue-on-error: true
        run: |
          set -e
          ls archive/obs/discharge/*.parquet >/dev/null 2>&1 || { echo "no discharge bundles, skipping"; exit 0; }
          CAT_ARG=""
          if [ -f archive/basins/station_catchments.parquet ]; then
            CAT_ARG="--catchments archive/basins/station_catchments.parquet"   # built by the assign step above
          fi                                                                   # else: the published table from the Hub
          aquascope basins signatures --archive archive $CAT_ARG --out archive/basins/station_signatures.parquet
          aquascope basins loo --signatures archive/basins/station_signatures.parquet $CAT_ARG \
            --out archive/basins/regionalization_skill.json --max-stations 3000

      - name: Publish to the Hugging Face dataset
        id: publish
        # inputs.publish is a boolean input: compare it as one (a string compare
        # against 'true' is always false and silently skipped the first CI runs).
        if: env.HF_TOKEN != '' && (github.event_name == 'schedule' || inputs.publish == true)
        run: |
          python - <<'EOF'
          import os
          from aquascope.archive import publish_folder
          print(publish_folder("archive", os.environ["HF_DATASET"], commit_message=f"harvest {os.environ.get('GITHUB_RUN_ID','')}"))
          EOF

      # A weekly archive that quietly stops publishing looks healthy for months. If the secret is gone on a
      # scheduled run, say so loudly rather than skipping the publish in silence.
      - name: Warn when HF_TOKEN is missing
        if: always() && env.HF_TOKEN == '' && github.event_name == 'schedule'
        run: |
          echo "::error::HF_TOKEN is not set, so the harvest ran but published nothing. Set the repository \
          secret HF_TOKEN to a Hugging Face token with write access to $HF_DATASET."
          exit 1

      # The other silent week (#449): a scheduled run that ran but did not publish (a failed bundle step, a refused
      # token) is red, and its job-health issue says why.
      - name: Fail when a scheduled run published nothing
        if: always() && github.event_name == 'schedule' && env.HF_TOKEN != '' && steps.publish.outcome != 'success'
        run: |
          echo "::error::The scheduled harvest did not publish (publish step: ${{ steps.publish.outcome }}), so the \
          Archive keeps last week's files. See the steps above for the cause."
          exit 1

      - name: Job summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("archive/health.json")
          if not p.exists():
              print("## Harvest\n\nno health.json written (harvest crashed before writing)")
              raise SystemExit
          h = json.loads(p.read_text())
          print(f"## Harvest {h['run_at']}\n")
          print(f"**{h['n_stations']:,} stations**, {h['n_ok']}/{len(h['sources'])} sources OK\n")
          print("| source | status | stations | seconds |\n| --- | --- | ---: | ---: |")
          for s in h["sources"]:
              status = "ok" if s["ok"] else f"FAILED: `{s['error']}`"
              print(f"| `{s['source']}` | {status} | {s['n_stations']:,} | {s['seconds']} |")
          obs = pathlib.Path("archive/obs/refresh_status.json")
          if obs.exists():
              r = json.loads(obs.read_text())
              print(f"\n## Observation refresh: {r['status']}\n")
              print("| source | variable | status |\n| --- | --- | --- |")
              for s in r['sources']:
                  print(f"| {s['source']} | {s['variable']} | {s['status']} |")
          else:
              print("\nObservation refresh did not run; catalog health does not imply fresh observations.")
          manifest = pathlib.Path("archive/obs/manifest.json")
          if manifest.exists():
              bundles = json.loads(manifest.read_text()).get('bundle_status', {})
              print("\n## Observation bundles\n")
              print("| source/variable | status | previous bundle retained |\n| --- | --- | --- |")
              for key, status in sorted(bundles.items()):
                  print(f"| {key} | {status['status']} | {status.get('retained_previous', False)} |")
          EOF

      - name: Open / update / close collector-health issues from health.json
        if: always() && (github.event_name == 'schedule' || inputs.health_issues == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/harvest_issues.py archive/health.json --repo "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload the harvest as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-${{ github.run_id }}
          path: archive/
          retention-days: 30

      - name: Fail only if every source failed
        run: |
          if [ "${{ steps.harvest.outputs.exit }}" != "0" ]; then
            echo "harvest exited ${{ steps.harvest.outputs.exit }} (all sources failed or publish failed)"; exit 1
          fi

      # Job health (#593): health/jobs/harvest.json and health/jobs/index.json, written only under health/jobs/, and
      # one job-health issue, opened or updated when a scheduled run fails and closed by the next good one. It runs
      # whether the job passed or not, needs only the standard library to record and to file the issue, and never
      # turns the job red itself. A capped run (max_items) never publishes its record, as it never should publish
      # its catalogue.
      - name: Job health
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PUBLISH: ${{ env.HF_TOKEN != '' && inputs.max_items == '' && (github.event_name == 'schedule' || inputs.publish == true) }}
          ISSUE: ${{ github.event_name == 'schedule' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/job_health.py report harvest --root archive --status "${{ job.status }}" --require "publish=${{ steps.publish.outcome }}" \
            --started "$JOB_STARTED" --run-url "$RUN_URL" --publish "$PUBLISH" --issue "$ISSUE"
