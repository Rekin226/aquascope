name: Pyodide Smoke Test

# Proves the aquascope wheel installs and runs under Pyodide (WASM).
# Catches incompatible C-extension dependencies or module-load side-effects
# that would silently break the live demo.

on:
  pull_request:
    paths:
      - "aquascope/**"
      - "explorer/**"
      - "pyproject.toml"
      - ".github/scripts/pyodide_smoke.mjs"
      - ".github/workflows/pyodide-smoke.yml"
  schedule:
    - cron: "0 0 * * 1"  # 00:00 UTC on Monday — weekly upstream canary
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Note when the job started (its health record's duration)
        run: echo "JOB_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Get Pyodide version
        id: pyodide-version
        if: github.event_name != 'schedule'
        run: |
          PYODIDE_VERSION=$(grep -oP 'pyodideIndexURL:\s*"[^"]*/v\K[^/"]+' explorer/config.js)

          if [ -z "$PYODIDE_VERSION" ]; then
            echo "Failed to extract Pyodide version from explorer/config.js index URL."
            exit 1
          fi

          echo "Using Pyodide $PYODIDE_VERSION"
          echo "PYODIDE_VERSION=$PYODIDE_VERSION" >> "$GITHUB_ENV"
          echo "version=$PYODIDE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install pyodide
        run: |
          # PRs/dispatch: pinned to PYODIDE_VERSION (the version explorer/config.js
          # specifies) so this job tests the runtime the site actually serves.
          # Scheduled Monday canary: float, to detect new incompatibilities early.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Using floating Pyodide version..."
            npm install pyodide
          else
            echo "Using Pyodide $PYODIDE_VERSION..."
            npm install "pyodide@${PYODIDE_VERSION}"
          fi

      - name: Cache Pyodide packages
        if: github.event_name != 'schedule'
        uses: actions/cache@v5
        with:
          path: /tmp/pyodide-cache
          key: pyodide-${{ steps.pyodide-version.outputs.version }}--${{ hashFiles('.github/scripts/pyodide_smoke.mjs') }}
          restore-keys: pyodide-${{ steps.pyodide-version.outputs.version }}-

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Run Pyodide smoke test
        run: node .github/scripts/pyodide_smoke.mjs dist/aquascope-*.whl

      - name: Assemble Explorer site
        run: python explorer/build.py --out dist-explorer --wheel dist/aquascope-*.whl

      # Job health (#593): health/jobs/pyodide-smoke.json and health/jobs/index.json, written only under
      # health/jobs/, and one job-health issue, opened or updated when a scheduled run fails and closed by the next
      # good one. It runs whether the job passed or not, needs only the standard library to record and to file the
      # issue, and never turns the job red itself.
      - name: Job health
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PUBLISH: ${{ secrets.HF_TOKEN != '' && github.event_name == 'schedule' }}
          ISSUE: ${{ github.event_name == 'schedule' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$PUBLISH" = "true" ]; then python3 -m pip install -q "huggingface_hub>=0.20"; fi
          python3 .github/scripts/job_health.py report pyodide-smoke --status "${{ job.status }}" \
            --started "$JOB_STARTED" --run-url "$RUN_URL" --publish "$PUBLISH" --issue "$ISSUE"
