# AquaScope Bench Phase 2 reference plan; the authoring rules are in _authoring.yaml.
# Inundation extent needs a hydraulic model over terrain, which aquascope does not run: the playbook declines.
id: flood_inundation_declined_potomac
playbook: flood_risk
title: Inundation extent asked at a gauged site (declined)
brief: >-
  Which streets and houses along the Potomac below Little Falls go under water in a 100-year flood, and how
  deep? Map the inundation extent.
intake:
  return_period: 100
  decision: inundation extent
site:
  name: Potomac River near Washington, DC (Little Falls pump station)
  lat: 38.94978
  lon: -77.12764
  source: usgs
  station_id: USGS-01646500
  years: 96.5
  recon: potomac_little_falls
decline: true
decline_kind: declined
rationale: >-
  The design flow at the point is answerable (see flood_at_site_potomac); the mapping of which streets flood and
  how deep is a hydraulic model over a terrain surface, a separate study aquascope does not run. The right plan is
  a decline that says so and offers the design flow instead.
