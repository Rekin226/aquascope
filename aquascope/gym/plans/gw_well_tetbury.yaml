# AquaScope Bench Phase 2 reference plan; the authoring rules are in _authoring.yaml.
# A borehole with fifty years of levels 4 km from the point: the trend with confidence, the groundwater drought
# index and a recharge estimate with a stated specific yield, as the groundwater_decline well branch has it.
id: gw_well_tetbury
playbook: groundwater_decline
title: Is the Cotswold limestone water table falling, and how fast
brief: >-
  A farm near Tetbury draws from the Great Oolite. Is the water table under it falling, and how fast? The
  Brokenborough observation borehole is a few kilometres away.
intake:
  horizon: 10
  concern: supply
site:
  name: Tetbury, Gloucestershire (rain gauge; Tetbury Slads Farm gauge 0.7 km; Brokenborough borehole 3.9 km)
  lat: 51.633147
  lon: -2.153993
  source: uk_ea
  station_id: 02bd4687-2b55-4f42-b1cf-77066f01cc70
  years: 34.9
  recon: tetbury
expected_branch: well
steps:
  - tool: analyze_station
    method: groundwater_trend
    gates:
      - {check: min_years, path: years}
      - {check: not_empty, path: trend}
      - {check: unit_present, path: unit}
  - tool: get_timeseries
    optional: true
    gates:
      - {check: not_empty, path: points}
    note: The monthly level series the table route to the drought index is computed on.
  - tool: sgi_drought
    method: sgi
    alternatives:
      - {tool: drought_propagation, method: sgi}
    note: The Standardised Groundwater Index on the monthly levels, by the table tool on a fetched series or by the propagation tool at the station.
  - tool: recharge
    method: recharge_wtf
    optional: true
    note: Water-table fluctuation with a stated specific yield; a daily series feeds it.
  - tool: describe_catchment
    optional: true
  - tool: low_flow_context
    method: baseflow_separation
    optional: true
    note: The baseflow index at the gauge 0.7 km away triangulates the recharge estimate.
forbidden:
  tools: [aquifer_drawdown, load_table]
  methods: []
rationale: >-
  Fifty years of monthly levels at a borehole within reach make a Sen's slope with a Mann-Kendall test defensible;
  the Standardised Groundwater Index on the monthly series (by either route the catalogue offers) gives the drought status and a water-table-fluctuation
  recharge with a stated specific yield is a reasonable optional addition. The plan reports the rate and its
  confidence, never the cause. A Theis drawdown needs transmissivity, storativity and a pumping rate nobody has
  supplied, so the drawdown tool has no input here.
