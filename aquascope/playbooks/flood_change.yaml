# Is the flood hazard changing? The questions that come after the stationary design flow.
#
# Evidence rules:
# - test the record for a step change and a trend first (Pettitt, PELT, Mann-Kendall; #376); a detected change
#   says the record is not one sample, never why (dams, rating changes, land use and climate look alike)
# - the stationary estimate stays the reference; the nonstationary GEV is a sensitivity beside it, preferred only
#   when the likelihood-ratio test and AIC support the trend term (Coles 2001), and design guidance under change
#   is not settled (Wasko et al. 2024, doi:10.5194/hess-28-1251-2024)
# - peaks over threshold use every large flood, not one a year (Lang et al. 1999)
# - the neighbours say whether the change is local or regional (field significance, Hosking and Wallis pooling)
id: flood_change
title: Is the flood hazard changing?
problem: flood_change
variable: discharge
description: Test a gauge's floods for change, fit a nonstationary model beside the stationary one, and check the neighbours.
intake:
  - name: return_period
    label: Return period (years)
    type: int
    default: 100
    min: 2
  - name: horizon_year
    label: Horizon year for the trend
    type: int
    default: 2050
    min: 2026
    max: 2100
  - name: years
    label: Years of record to use (empty for the whole record; a trend needs at least 20)
    type: int
    default: null
    min: 20
# What the study must know before it plans, asked one at a time as a pick list and only when the question leaves
# it open: a change over the whole record and one over recent decades can disagree.
checklist:
  - field: years
    ask: Which period should the change tests cover?
    why: A step change or a trend over the whole record and one over recent decades can disagree; every test is run on the one you pick.
    options:
      - value: null
        label: The whole record
        match: \b(whole|entire|full|all)\b
      - value: 50
        label: The last 50 years
      - value: 30
        label: The last 30 years
branches:
  - id: long_record
    when:
      - path: context.years_by_variable.discharge
        op: ">="
        value: 20
    station_variable: discharge
    rationale: >-
      {{ station.years }} years of daily discharge at {{ station.name }} ({{ station.source }}
      {{ station.station_id }}): long enough to test the annual maxima for a step change and a trend, to fit a
      GEV whose location moves with time next to the stationary one, and to set the neighbours' records beside it.
    steps:
      - id: s1
        tool: change_points
        method: change_point_test
        arguments:
          source: "{{ station.source }}"
          station_id: "{{ station.station_id }}"
          years: "{{ intake.years }}"
          series: annual_max
        rationale: >-
          Is the flood record one sample? Pettitt's test for a step change, PELT for the segments and Mann-Kendall
          with Sen's slope for a trend, on the annual maxima a flood frequency fit assumes are exchangeable.
        expects:
          - check: min_years
            value: 20
            path: n
          - check: not_empty
            path: pettitt
      - id: s2
        tool: flood_frequency
        method: at_site_flood_frequency
        arguments:
          source: "{{ station.source }}"
          station_id: "{{ station.station_id }}"
          years: "{{ intake.years }}"
          bootstrap_ci: true
          return_periods: ["{{ intake.return_period }}"]
        rationale: >-
          The stationary reference: GEV by L-moments and Log-Pearson III at T = {{ intake.return_period }} years,
          the number every change is measured against.
        expects:
          - check: min_years
            value: 20
            path: ffa.n_years
          - check: max_return_period_factor
            value: 3
            path: ffa.n_years
            return_period: "{{ intake.return_period }}"
      - id: s3
        tool: nonstationary_flood
        method: nonstationary_gev
        arguments:
          source: "{{ station.source }}"
          station_id: "{{ station.station_id }}"
          years: "{{ intake.years }}"
          return_periods: [10, "{{ intake.return_period }}"]
          horizon_year: "{{ intake.horizon_year }}"
        rationale: >-
          A GEV whose location moves linearly with time, tested against the stationary GEV by likelihood ratio and
          AIC, with the {{ intake.return_period }}-year level at the start of the record, today and in
          {{ intake.horizon_year }} (an extrapolation of the fitted trend, flagged as one).
        expects:
          - check: min_years
            value: 20
            path: n_years
          - check: ci_finite
            path: nonstationary.ci_last_year.ci
      - id: s4
        tool: pot_flood
        method: pot_gpd
        optional: true
        arguments:
          source: "{{ station.source }}"
          station_id: "{{ station.station_id }}"
          years: "{{ intake.years }}"
          return_periods: [10, "{{ intake.return_period }}"]
        rationale: >-
          Every independent flood over a threshold, fitted to a Generalised Pareto: a second estimate of the tail
          that does not throw away the second-largest flood of a wet year.
        expects:
          - check: min_samples
            value: 10
            path: n_peaks
      - id: s5
        tool: regional_flood
        method: regional_index_flood
        optional: true
        arguments:
          lat: "{{ site.lat }}"
          lon: "{{ site.lon }}"
          radius_km: 75
          source: "{{ station.source }}"
          station_id: "{{ station.station_id }}"
        rationale: >-
          The gauges within 75 km studied together: whether their flood trends are field-significant (a regional
          signal rather than one gauge's) and a pooled growth curve to set beside the at-site fit.
        expects:
          - check: min_sites
            value: 5
            path: n_pooled
  - id: regional_only
    when: []
    rationale: >-
      No gauge with 20 years of discharge within reach: change cannot be tested at the site. The gauges around it
      are studied together instead, for field significance of their trends and a pooled growth curve.
    steps:
      - id: s1
        tool: regional_flood
        method: regional_index_flood
        arguments:
          lat: "{{ site.lat }}"
          lon: "{{ site.lon }}"
          radius_km: 100
        rationale: >-
          The gauges within 100 km: how many show rising or falling floods, whether that is more than chance
          across the region, and the pooled growth curve.
        expects:
          - check: min_sites
            value: 5
            path: n_pooled
declines:
  - when:
      - path: intake.horizon_year
        op: ">"
        value: 2075
    say: >-
      A horizon of {{ intake.horizon_year }} extends a line fitted to the record half a century or more beyond it.
      That is not an estimate of the flood in {{ intake.horizon_year }}; a trend in the past is not a forecast.
      Ask for a horizon up to 2075, or for the climate change study, which uses model futures to 2050.
caveats:
  - >-
    A detected change says the record is not one sample; it does not say why. Dams, a new rating curve, land-use
    change and climate all leave the same mark in the annual maxima. Check the station's history before
    attributing a trend to climate.
  - >-
    The stationary estimate stays the reference. The nonstationary GEV is a sensitivity beside it, preferred only
    when the likelihood-ratio test and AIC both support the trend term; its levels beyond the record extend a
    fitted line, and design guidance under a changing climate is not settled (Wasko et al. 2024).
citations:
  - "Pettitt, A. N. (1979). A non-parametric approach to the change-point problem. J. R. Stat. Soc. C, 28(2), 126-135."
  - "Coles, S. (2001). An Introduction to Statistical Modeling of Extreme Values. Springer."
  - "Lang, M., Ouarda, T. B. M. J., & Bobée, B. (1999). Towards operational guidelines for over-threshold modeling. J. Hydrol., 225, 103-117."
  - "Hosking, J. R. M., & Wallis, J. R. (1997). Regional Frequency Analysis. Cambridge University Press."
